<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My News App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <div id="app">
        <!-- Header -->
        <header class="main-header">
            <div class="header-top">
                <span class="date" id="current-date"></span>
                <h1>My News</h1>
            </div>
            <div class="category-tabs" id="category-tabs">
                <!-- Categories will be injected here -->
            </div>
        </header>

        <!-- Main Feed -->
        <main id="news-feed" class="news-feed">
            <div class="loader" id="loader">Caricamento notizie...</div>
            <!-- News cards will be injected here -->
        </main>

        <!-- Settings View (Hidden by default) -->
        <section id="settings-view" class="settings-view hidden">
            <header class="view-header">
                <button id="close-settings" class="icon-btn">✕</button>
                <h2>Impostazioni</h2>
            </header>
            
            <div class="settings-content">
                <div class="setting-group">
                    <h3>Visualizzazione</h3>
                    <div class="setting-item">
                        <label for="font-size">Dimensione Testo</label>
                        <input type="range" id="font-size" min="14" max="24" value="16">
                    </div>
                </div>

                <div class="setting-group">
                    <h3>Fonti Notizie</h3>
                    <div id="sources-list" class="managed-list">
                        <!-- Sources will be injected here -->
                    </div>
                    <div class="add-action">
                        <input type="text" id="new-source-url" placeholder="URL Fonte (es. https://...)">
                        <button id="add-source-btn" class="primary-btn">Aggiungi</button>
                    </div>
                </div>

                <div class="setting-group">
                    <h3>Categorie e Gruppi</h3>
                    <div id="categories-list" class="managed-list">
                        <!-- Categories will be injected here -->
                    </div>
                    <div class="add-action">
                        <input type="text" id="new-category-name" placeholder="Nome Categoria">
                        <button id="add-category-btn" class="primary-btn">Crea</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Gemini Summary Modal -->
        <div id="summary-modal" class="modal hidden">
            <div class="modal-content">
                <button id="close-modal" class="close-modal">✕</button>
                <div class="modal-header">
                    <span class="gemini-badge">Gemini Summary</span>
                    <h3 id="modal-title"></h3>
                </div>
                <div id="modal-body" class="summary-text">
                    <!-- Summary content -->
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <nav class="tab-bar">
            <button class="tab-item active" id="nav-home">
                <span class="icon">📰</span>
                <span>Feed</span>
            </button>
            <button class="tab-item" id="nav-categories-mgr">
                <span class="icon">🏷️</span>
                <span>Categorie</span>
            </button>
            <button class="tab-item" id="nav-settings">
                <span class="icon">⚙️</span>
                <span>Impostazioni</span>
            </button>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
