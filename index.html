<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My News App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <div id="app">
        <!-- Header -->
        <header class="main-header">
            <div class="header-top">
                <div class="header-left">
                    <span id="day-greeting" class="greeting"></span>
                    <span class="date" id="current-date"></span>
                </div>
                <div class="header-right">
                    <h1 class="brand-title">My News</h1>
                    <button id="open-settings-btn" class="round-settings-btn">⚙️</button>
                </div>
            </div>
            <div class="category-tabs" id="category-tabs">
                <!-- Categories will be injected here -->
            </div>
        </header>

        <!-- Main Feed -->
        <main id="news-feed" class="news-feed">
            <div class="loader" id="loader">Caricamento notizie...</div>
        </main>

        <!-- Settings Bottom Sheet -->
        <section id="settings-view" class="settings-view hidden">
            <div class="sheet-handle"></div>
            <header class="view-header">
                <h2>Impostazioni</h2>
                <button id="close-settings" class="close-btn">Fatto</button>
            </header>
            
            <div class="settings-content">
                <div class="setting-group">
                    <h3>Visualizzazione</h3>
                    <div class="setting-item">
                        <label for="font-size">Dimensione Testo</label>
                        <input type="range" id="font-size" min="14" max="24" value="16">
                    </div>
                </div>

                <div class="setting-group">
                    <h3>Fonti Notizie</h3>
                    <div id="sources-list" class="managed-list"></div>
                    <div class="add-action">
                        <input type="text" id="new-source-url" placeholder="URL Feed RSS">
                        <button id="add-source-btn" class="primary-btn">Aggiungi</button>
                    </div>
                </div>

                <div class="setting-group">
                    <h3>Categorie</h3>
                    <div id="categories-list" class="managed-list"></div>
                    <div class="add-action">
                        <input type="text" id="new-category-name" placeholder="Nome Categoria">
                        <button id="add-category-btn" class="primary-btn">Crea</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Gemini & Article Modal -->
        <div id="summary-modal" class="modal hidden">
            <div class="modal-content">
                <button id="close-modal" class="modal-close-btn">✕</button>
                <div class="modal-header">
                    <span class="gemini-badge">Gemini Analysis</span>
                    <h3 id="modal-title"></h3>
                </div>
                <div id="modal-body" class="summary-text"></div>
                
                <!-- In-App Browser Iframe -->
                <div id="iframe-container" class="iframe-container hidden">
                    <iframe id="article-iframe" src="" frameborder="0"></iframe>
                </div>
            </div>
        </div>

        <!-- Single Tab Navigation -->
        <nav class="tab-bar">
            <button class="tab-item active" id="nav-home">
                <span class="icon">📰</span>
                <span>Feed Notizie</span>
            </button>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
